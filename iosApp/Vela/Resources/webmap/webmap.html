<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Map</title>
<link rel="stylesheet" href="maplibre-gl.css" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #map { position: absolute; inset: 0; background: transparent; }
  .maplibregl-canvas { outline: none; }
  .vela-marker { pointer-events: none; position: absolute; }
  .vela-marker img { display: block; width: 100%; height: 100%; pointer-events: none; }
  .vela-puck { pointer-events: none; width: 0; height: 0; }
  .vela-puck-halo {
    position: absolute; border-radius: 50%; background: rgba(0, 122, 255, 0.16);
    border: 1px solid rgba(0, 122, 255, 0.32); transform: translate(-50%, -50%);
  }
  .vela-puck-cone {
    position: absolute; width: 0; height: 0; left: -14px; top: -34px;
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-bottom: 34px solid rgba(0, 122, 255, 0.28); transform-origin: 14px 34px;
  }
  .vela-puck-dot {
    position: absolute; width: 18px; height: 18px; left: -9px; top: -9px; border-radius: 50%;
    background: #007aff; border: 3px solid #ffffff; box-sizing: border-box;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  }
  .vela-callout .maplibregl-popup-content {
    font: 14px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: 8px 12px; border-radius: 10px; color: #1c1c1e;
  }
  .vela-callout .vela-callout-subtitle { font-size: 12px; color: #6e6e73; margin-top: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="maplibre-gl.js"></script>
<script src="webmap.js"></script>
</body>
</html>
