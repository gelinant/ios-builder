# XcodeGen spec for the Vela iOS app. Generate with `xcodegen generate` in this directory;
# Vela.xcodeproj and Vela/Info.plist are generated and not versioned (docs/ios/BUILD-IOS.md).
name: Vela

options:
  bundleIdPrefix: app.vela
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The globe build is a pre-release xcframework, never committed. Fetch it before XcodeGen so the
  # generated project points at a real file; the script is idempotent and checks the pinned sum.
  preGenCommand: bash ../scripts/ios/fetch-maplibre-globe.sh app

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # Pure Swift bzip2 + tar for the downloadable Piper voices (Android uses commons-compress).
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    exactVersion: 4.9.1

targets:
  Vela:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Vela
        excludes:
          - "**/README.md"
          - "Vela.entitlements"
      # ActivityAttributes is compiled into both modules, with no package or framework to ship.
      - path: Shared
      # The one payload shared with the Home Screen extension (docs/ios/WIDGETS.md).
      - path: VelaWidgets/WidgetSnapshot.swift
    dependencies:
      # Pinned pre-release with MLN_WITH_GLOBE, fetched into Vendor/ by
      # scripts/ios/fetch-maplibre-globe.sh. Dynamic framework: the app embeds it.
      - framework: Vendor/MapLibre.xcframework
        embed: true
      - package: SWCompression
      # Prebuilt sherpa-onnx 1.13.8 static xcframework, fetched by scripts/ios/fetch-sherpa.sh
      # and never committed. Static: linked into the app, nothing to embed.
      - framework: Vendor/SherpaOnnxC.xcframework
        embed: true
      - target: NavActivityExtension
      - target: VelaWidgets
    entitlements:
      path: Vela/Vela.entitlements
    # The Kotlin framework VelaCore (module :ios-shared, static) is built by Gradle before the
    # Swift sources compile, then found through FRAMEWORK_SEARCH_PATHS and linked by OTHER_LDFLAGS
    # below (docs/ios/BUILD-IOS.md).
    preBuildScripts:
      - name: Fetch MapLibre globe
        script: bash "$SRCROOT/../scripts/ios/fetch-maplibre-globe.sh" app
        basedOnDependencyAnalysis: false
      - name: Build VelaCore (Kotlin)
        script: bash "$SRCROOT/scripts/build-velacore.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Vela/Info.plist
      properties:
        CFBundleDisplayName: Vela
        CFBundleDevelopmentRegion: en
        # The 24 catalog languages, including ku for the kmr option. Declaring them keeps the
        # system language picker and the per-app language row aware of the app catalog.
        CFBundleLocalizations:
          - en
          - en-GB
          - ar
          - de
          - es
          - et
          - fr
          - he
          - hu
          - it
          - ja
          - ku
          - nl
          - pl
          - pt-PT
          - pt-BR
          - ro
          - ru
          - sl
          - sv
          - tr
          - uk
          - zh-Hans
          - zh-Hant
        CFBundleURLTypes:
          - CFBundleURLName: app.vela.ios
            CFBundleURLSchemes:
              - vela
          # geo: URIs from contacts, calendars and other maps apps. iOS has no default-maps
          # choice: the user picks Vela in the system open-with sheet, and vela:// is the
          # public entry point other apps can call directly.
          - CFBundleURLName: app.vela.ios.geo
            CFBundleURLSchemes:
              - geo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSMicrophoneUsageDescription: Vela listens to what you say when you tap the microphone for voice search. Nothing is recorded until you tap it.
        NSSpeechRecognitionUsageDescription: Vela uses on-device speech recognition to turn your voice into a search or a destination.
        NSLocationWhenInUseUsageDescription: Vela shows where you are on the map and guides you along your route.
        NSLocationAlwaysAndWhenInUseUsageDescription: Vela keeps guiding you during navigation while the screen is off or another app is open.
        NSContactsUsageDescription: Vela looks up the person you asked for when you say or type call, on this phone only. Contacts are never uploaded or kept.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios
        PRODUCT_NAME: Vela
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Declares JavaScriptCore's JSContextGroupSetExecutionTimeLimit (JavaScriptCoreJsEngine).
        SWIFT_OBJC_BRIDGING_HEADER: Vela/Platform/Vela-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor", "$(SRCROOT)/../ios-shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "VelaCore", "-lc++", "-lz"]
        # Gradle reads and writes the whole source tree, which the script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # VelaCore has no x86_64 simulator slice (iosSimulatorArm64 only).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    scheme:
      testTargets:
        - VelaTests
        - VelaUITests

  NavActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NavActivityExtension
      - path: Shared
    info:
      path: NavActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: Vela Navigation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.navactivity
        PRODUCT_NAME: NavActivityExtension
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]

  # Home Screen widgets: the parked car and the last stop whose board was opened. Reads only the
  # App Group payload written by the app; it never calls Google, Transitous or Core Location
  # (docs/ios/WIDGETS.md).
  VelaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VelaWidgets
        excludes:
          - "*.entitlements"
          - "Info.plist"
      # Shared with the app: one snapshot definition, the design tokens and the string catalog.
      - path: Vela/Design/DesignTokens.swift
      - path: Vela/Resources/VelaL10n.swift
      - path: Vela/Resources/Assets.xcassets
      - path: Vela/Resources/Localizable.xcstrings
    info:
      path: VelaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Vela Widgets
        CFBundleDevelopmentRegion: en
        # The widget bundle compiles the same Localizable.xcstrings as the app, so the extension
        # shows the system language, or the app's language choice, without a host lookup.
        CFBundleLocalizations:
          - en
          - en-GB
          - ar
          - de
          - es
          - et
          - fr
          - he
          - hu
          - it
          - ja
          - ku
          - nl
          - pl
          - pt-PT
          - pt-BR
          - ro
          - ru
          - sl
          - sv
          - tr
          - uk
          - zh-Hans
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VelaWidgets/VelaWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.widgets
        PRODUCT_NAME: VelaWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]

  VelaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VelaTests
      # The repository's real signed bundle, for the SignatureVerifier test.
      - path: ../calibration.json
        buildPhase: resources
      - path: ../calibration.json.sig
        buildPhase: resources
    dependencies:
      - target: Vela
      - framework: Vendor/MapLibre.xcframework
        embed: false
      - package: SWCompression
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # `@testable import Vela` loads the modules Vela imports, VelaCore included. The test
        # bundle does not link it: the symbols are in the app binary it is loaded into.
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor", "$(SRCROOT)/../ios-shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  # End-to-end search on the simulator (needs the network); scripts/ios/ci-ipa.sh runs it on its
  # own, after the unit tests, with the simulator's location set to San Francisco.
  VelaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VelaUITests
    dependencies:
      - target: Vela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
