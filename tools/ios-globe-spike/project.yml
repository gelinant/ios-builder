name: GlobeSpike

# Throwaway G-1 app (docs/ios/GLOBE-SPIKE.md). Not part of Vela: no target, source or resource here
# is shared with iosApp/. The MapLibre xcframework is fetched into Vendor/ by
# scripts/ios/fetch-maplibre-globe.sh and is never committed.

options:
  bundleIdPrefix: app.vela
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  GlobeSpike:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - framework: Vendor/MapLibre.xcframework
        embed: true
    info:
      path: Generated/GlobeSpike-Info.plist
      properties:
        CFBundleDisplayName: GlobeSpike
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.globespike
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"

  GlobeBaseline:
    type: application
    platform: iOS
    sources:
      - path: Baseline
    info:
      path: Generated/GlobeBaseline-Info.plist
      properties:
        CFBundleDisplayName: GlobeBaseline
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.globebaseline
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"

  GlobeSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GlobeSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.globespike.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GlobeSpike:
    build:
      targets:
        GlobeSpike: all
        GlobeSpikeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlobeSpikeUITests
  GlobeBaseline:
    build:
      targets:
        GlobeBaseline: all
    run:
      config: Debug
